name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Resolve tag version and sync manifests
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $semver = $tag.TrimStart("v", "V")
          Write-Output "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Sync version into package.json, tauri.conf.json, and Cargo.toml so the built binary reports the exact tag version
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $pkg.version = $semver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8

          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauriConf.version = $semver
          $tauriConf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8

          $cargoToml = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargoToml = [regex]::Replace($cargoToml, '(?m)^version = "[^"]+"', "version = `"$semver`"", 1)
          Set-Content "src-tauri/Cargo.toml" -Value $cargoToml -Encoding UTF8 -NoNewline

      - name: Install frontend dependencies
        run: npm ci

      - name: Build single-file portable Windows EXE
        run: npm run tauri build -- --no-bundle

      - name: Package portable artifact with standard naming
        id: artifact
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $outName = "Islandex-$tag-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          Copy-Item "src-tauri/target/release/islandex.exe" "release-artifacts/$outName" -Force
          Write-Output "path=release-artifacts/$outName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $semver = "${{ steps.version.outputs.semver }}"
          $changelog = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8

          # Match section heading like "## [v0.1.0]" or "## [0.1.0]" or "## v0.1.0"
          $pattern = "(?ms)^##\s+\[?(?:$([regex]::Escape($tag))|$([regex]::Escape($semver)))\]?[^\r\n]*\r?\n(.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success -and $match.Groups[1].Value.Trim().Length -gt 0) {
            $notes = $match.Groups[1].Value.Trim()
          } else {
            $notes = $changelog.Trim()
          }
          Set-Content "release_notes.md" -Value $notes -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Islandex ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          files: |
            ${{ steps.artifact.outputs.path }}
